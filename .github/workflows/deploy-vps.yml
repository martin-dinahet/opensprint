name: Deploy VPS

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to VPS
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload source
        run: |
          ssh -i ~/.ssh/vps_key "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "sudo mkdir -p '${{ secrets.VPS_APP_DIR }}' && sudo chown '${{ secrets.VPS_USER }}:${{ secrets.VPS_USER }}' '${{ secrets.VPS_APP_DIR }}'"
          tar \
            --exclude='.git' \
            --exclude='.next' \
            --exclude='node_modules' \
            --exclude='.pnpm-store' \
            --exclude='.env' \
            --exclude='.env.*' \
            -czf - . | ssh -i ~/.ssh/vps_key "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "tar -xzf - -C '${{ secrets.VPS_APP_DIR }}'"

      - name: Restart services
        run: |
          ssh -i ~/.ssh/vps_key "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "cd '${{ secrets.VPS_APP_DIR }}' && sudo docker compose --env-file .env.production -f compose.prod.yaml up -d --build --remove-orphans"
