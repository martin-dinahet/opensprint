name: opensprint

services:
  app:
    image: ghcr.io/martin-dinahet/opensprint:latest
    container_name: opensprint
    restart: unless-stopped
    env_file:
      - /opt/secrets/opensprint.env
    environment:
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
    expose:
      - "3000"
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  frontend:
    external: true
  backend:
    external: true
